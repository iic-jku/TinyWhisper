# =============================================================================
# Bondplan configuration for TinyWhisper
#
# Consumed by scripts/run_bondplan.py (run from this folder):
#   python3 scripts/run_bondplan.py config.yaml
#   klayout -b -r scripts/run_bondplan.py -rd config=config.yaml
#
# Structured like a LibreLane config.yaml: flat UPPER_CASE keys, `dir::`
# prefix for paths relative to this file, placement as location/orientation.
# {design} in any value expands to DESIGN_NAME.
# =============================================================================

meta:
  version: 1
  flow: Bondplan

DESIGN_NAME: tinywhisper

# --- Die (chip) --------------------------------------------------------------
DIE_GDS: dir::../layout/{design}_top_logo_fill.gds.gz
# DIE_CELL: chip_top              # default: top cell of DIE_GDS

# Layers copied into the extracted die view (IHP SG13G2):
DIE_EXTRACT_LAYERS: ["9/0", "133/0", "134/0"]   # Passiv, TopVia2, TopMetal2
DIE_EXTRACT_GDS: dir::layout/{design}_top_logo_TM2.gds.gz
DIE_EXTRACT_CELL: "{design}_top_logo_TM2"
DIE_KEEP_LABELS: false            # do not copy DIE_PAD_LABEL_LAYER into extract

# Bondpad detection on the die:
DIE_PAD_LAYER: "9/0"              # Passiv openings define the bondpads
DIE_PAD_MIN_SIZE: 40              # um; ignore smaller Passiv openings
DIE_PAD_LABEL_LAYER: "134/25"     # TopMetal2.text labels carry the pad names

# --- Package -----------------------------------------------------------------
# PACKAGE_GDS is generated automatically from the EUROPRACTICE package
# library: the PACKAGE_NAME sheet cell is copied out (layer 207/0 dropped).
# See the README for the list of supported PACKAGE_NAME values.
PACKAGE_LIBRARY_GDS: dir::layout/EP_PACKAGES_08022018.gds
PACKAGE_NAME: OP_QFN48_A4_FIT
# PACKAGE_GDS: ...                # default: <library dir>/<PACKAGE_NAME>.gds
# PACKAGE_FOOTPRINT_CELL: ...     # default: auto-detect the lead frame
# Sheet texts to remove when generating the package, as case-insensitive
# glob patterns (here: the template revision note in the bottom corner)
PACKAGE_DELETE_TEXTS: ["Updated by *"]
PACKAGE_LEAD_LAYER: "210/0"       # lead polygons (one per pin)
PACKAGE_PIN_LABEL_LAYER: "211/0"  # numbered pin texts next to their leads
PACKAGE_PIN_LABEL_OFFSET: 250     # um; pin number distance outside the
                                  # package outline
PACKAGE_PIN_LABEL_SIZE: 180       # um; pin number font size

# --- Die placement -----------------------------------------------------------
# location: lower-left corner of the (oriented) die outline, in um, relative
# to the lower-left corner of the package inner border (the square touching
# the lead tips). Omit location to center the die in the package.
# orientation: N/S/E/W/FN/FS/FE/FW, as in LibreLane MACROS instances.
DIE_PLACEMENT:
  # location: [1760.5, 1760.5]    # default: centered
  orientation: N

# --- Bondwires ---------------------------------------------------------------
BONDWIRE_LAYER: "190/0"           # Exchange0.drawing (free for documentation)
BONDWIRE_TEXT_LAYER: "190/25"     # Exchange0.text, for per-wire labels
BONDWIRE_WIDTH: 25                # um (drawing width only)
BONDWIRE_LABELS: true             # write "<pin> <pad>" text at each wire
TABLE_TEXT_SIZE: 100              # um; bond table font size
TABLE_GAP: 400                    # um; gap between plan and bond table.
                                  # The side margins are computed so that
                                  # left and right come out equal.
BONDWIRE_LEAD_SITE: 0.5           # bond point on lead: 0 = tip .. 1 = far end
BONDWIRE_MAX_LENGTH: 3500         # um; warn above this
BONDWIRE_MAX_SKEW: 30             # deg; warn if a wire lands skewed on its lead
EPAD_WIRE_LENGTH: 500             # um; length of exposed-pad downbond stubs

# Guarded (sensitive) wires: warn if any other wire comes closer than
# GUARD_SPACING. Entries are pins or [groups]; wires within one group
# (e.g. a differential quad) are exempt from each other's check.
GUARDED_PINS: [[29, 30, 31, 32]]  # Voutp/n_Q_RF, Voutn/p_I_RF
GUARD_SPACING: 60                 # um; see result.md for the actual gaps

# --- Output ------------------------------------------------------------------
BONDPLAN_GDS: dir::layout/{design}_bondplan.gds
BONDPLAN_CELL: "{design}_bondplan"
# 207/0 is the drawing template's A4 paper rectangle - documentation
# scaffolding with no use in the bondplan (the frame lines on 211/0 mark
# the sheet); 134/25 are the die pad name labels
BONDPLAN_DELETE_LAYERS: ["207/0", "134/25"]
# Bond report: .md -> Markdown (summary + bond table), .csv -> raw CSV
BONDPLAN_REPORT: dir::result.md

# PNG follows ihp130/scripts/lay2img.py conventions: writes *_white / *_black
BONDPLAN_PNG: dir::render/{design}_bondplan.png
BONDPLAN_SVG: dir::render/{design}_bondplan.svg
IMAGE_WIDTH: 2000                 # px
IMAGE_OVERSAMPLING: 2
IMAGE_REGION: full                # package (footprint + bond table) | full

# --- Drawing sheet (title block) -----------------------------------------------
# Keep the EUROPRACTICE A4 drawing frame and fill in its title block.
# Keys match the label texts on the sheet (case/colon insensitive). Values
# may use placeholders: {design} {date} {wire_count} {bondwire_width_um}
# {max_wire_length_um/mm} {min_wire_length_um} {min_gap_um}
# {die_width_um/mm} {die_height_um/mm} {pad_pitch_um} {pad_opening_um}.
# A mapping value allows fine placement: {value: "...", dx: <um>, dy: <um>}
# relative to the label position.
SHEET_KEEP: true
SHEET_FIELDS:
  Request: "JKU IICQC - {design}"
  Date: "{date}"
  MPW: "IHP SG13G2"
  Die: "{design}"
  "Size incl scribe": "{die_width_mm} x {die_height_mm} mm"
  "Max. wire length": "{max_wire_length_mm} mm"
  "Pad-pitch": "{pad_pitch_um} um"
  "Pad-opening": "{pad_opening_um} um"
  "Die-thickness": "200 um"
  "Extra Info": "{wire_count} wires, min gap {min_gap_um} um, mount the lid with its white dot at pin 1"
  "Qty packaged": "10"
  "Qty naked": "20"
  "Die Attach": "conductive epoxy"
  "Wire": "Gold, {bondwire_width_um} um"

# Lid option checkbox to mark with an X (Taped | Sealed | Glued | Glass).
# Glued is the standard for open-molded plastic packages (OmPP): the die
# sits in an open cavity and the cover is glued on after wire bonding.
LID: Glued

# Font scale factors for the sheet's own texts (label -> factor).
# Note: the headline text is package-specific; a warning is printed if an
# entry matches no text on the sheet.
SHEET_TEXT_SCALE:
  "Request": 0.7
  "QFN48(7x7)": 0.7

# --- Pinout ------------------------------------------------------------------
# Package pin number -> die pad name (TopMetal2.text label on the pad).
# A list bonds several wires to one lead. Use ~ (null) for NC pins.
# Duplicate names (VDD/VSS/...) are resolved by shortest-wire assignment.
# EPAD: downbonds to the exposed pad, drawn from leftover pads with the
# given names, parallel to the neighboring wires.
PINOUT:
  # Left side, top to bottom (pins 1-12)
  1:  "clk_PAD"                   # clk
  2:  "rst_n_PAD"                 # rst_n
  3:  "input_PAD[5]"              # so
  4:  "output_PAD[8]"             # si
  5:  "output_PAD[7]"             # sclk
  6:  "output_PAD[6]"             # sram_ce
  7:  "IOVDD"                     # IOVDD
  8:  "VDD"                       # VDD
  9:  "bidir_PAD[8]"              # sda
  10: "output_PAD[5]"             # scl
  11: "input_PAD[4]"              # rx
  12: "output_PAD[4]"             # tx

  # Bottom side, left to right (pins 13-24)
  13: "IOVDD"                     # IOVDD
  14: "IOVSS"                     # IOVSS
  15: "VDD"                       # VDD
  16: "output_PAD[0]"             # GPIO_o[0]
  17: "output_PAD[1]"             # GPIO_o[1]
  18: "output_PAD[2]"             # GPIO_o[2]
  19: "output_PAD[3]"             # GPIO_o[3]
  20: "VDD"                       # VDD
  21: "bidir_PAD[4]"              # Q_p
  22: "bidir_PAD[5]"              # Q_n
  23: "bidir_PAD[6]"              # lo_Q
  24: "bidir_PAD[7]"              # lo_Qx

  # Right side, bottom to top (pins 25-36)
  25: "analog_PAD[0]"             # Vinp_Q
  26: "analog_PAD[1]"             # Vinn_Q
  27: "VSS"                       # VSS
  28: "VDD"                       # VDD
  29: "analog_PAD[2]"             # Voutp_Q_RF
  30: "analog_PAD[3]"             # Voutn_Q_RF
  31: "analog_PAD[4]"             # Voutn_I_RF
  32: "analog_PAD[5]"             # Voutp_I_RF
  33: "VDD"                       # VDD
  34: "VSS"                       # VSS
  35: "analog_PAD[6]"             # Vinn_I
  36: "analog_PAD[7]"             # Vinp_I

  # Top side, right to left (pins 37-48)
  37: "bidir_PAD[3]"              # lo_Ix
  38: "bidir_PAD[2]"              # lo_I
  39: "bidir_PAD[1]"              # I_n
  40: "bidir_PAD[0]"              # I_p
  41: "VDD"                       # VDD
  42: "input_PAD[3]"              # GPIO_i[3]
  43: "input_PAD[2]"              # GPIO_i[2]
  44: "input_PAD[1]"              # GPIO_i[1]
  45: "input_PAD[0]"              # GPIO_i[0]
  46: "VSS"                       # VSS
  47: "VDD"                       # VDD
  48: "IOVDD"                     # IOVDD

  # Downbonds to the exposed pad (die attach paddle, package GND):
  # all remaining VSS / IOVSS pads
  EPAD: ["VSS", "VSS", "VSS", "VSS", "VSS", "VSS", "IOVSS", "IOVSS"]
