version = 1

# Files that cannot carry an SPDX header (layout data, netlists, schematics,
# figures, measurement data, generated reports and renders) are annotated
# here. Source files (Python scripts, Makefiles, RTL, configs, workflows)
# carry their own SPDX headers, so the license check still catches new source
# files without licensing information.

[[annotations]]
path = [".designinit", ".gitattributes", ".gitignore", ".gitmodules", "CITATION.cff", "README.md", "ToDo.md"]
SPDX-FileCopyrightText = "2025-2026 The TinyWhisper Team"
SPDX-License-Identifier = "Apache-2.0 WITH SHL-2.1"

[[annotations]]
path = "doc/**"
SPDX-FileCopyrightText = "2025-2026 The TinyWhisper Team"
SPDX-License-Identifier = "Apache-2.0 WITH SHL-2.1"

[[annotations]]
path = ["enclosure/**", "measurements/**", "pcb/**", "presentations/**", "software/**"]
SPDX-FileCopyrightText = "2025-2026 The TinyWhisper Team"
SPDX-License-Identifier = "Apache-2.0 WITH SHL-2.1"

# Legacy sky130 test chip (kept for reference, no longer actively maintained).
[[annotations]]
path = "sky130/**"
SPDX-FileCopyrightText = "2025-2026 The TinyWhisper Team"
SPDX-License-Identifier = "Apache-2.0 WITH SHL-2.1"

[[annotations]]
path = ["ihp130/README.md", "ihp130/doc/**", "ihp130/flow/logo/**", "ihp130/flow/reports/**", "ihp130/layout/**", "ihp130/netlist/**", "ihp130/release/**", "ihp130/render/**", "ihp130/schematic/**", "ihp130/verification/**"]
SPDX-FileCopyrightText = "2025-2026 The TinyWhisper Team"
SPDX-License-Identifier = "Apache-2.0 WITH SHL-2.1"

